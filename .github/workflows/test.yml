# Controlli automatici a ogni pull request e a ogni push su main.
# - "Pagine": Content Security Policy presente e identica ovunque, nessuno
#   script o gestore di eventi inline, import tra moduli validi.
# - "Regole Firestore e Storage": le suite di test delle regole sugli emulatori.
name: Test

on:
  pull_request:
  push:
    branches: [main]

# Il workflow legge soltanto il codice: nessun permesso di scrittura.
permissions:
  contents: read

jobs:
  pagine:
    name: Pagine (CSP, script, import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/pagine/*.test.mjs"

  regole:
    name: Regole Firestore e Storage (emulatore)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/regole
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/regole/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulatori-firebase-${{ hashFiles('test/regole/package-lock.json') }}
      - run: npm ci
      - run: npm test
