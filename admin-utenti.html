  <link rel="stylesheet" href="assets/css/dm.css" />
  <script type="module" src="assets/js/pwa.js"></script>
</head>
<body>
  <div id="veil" class="loading-veil">
    <div class="die-stage">
      <div class="die-shadow"></div>
      <div class="die-svg-wrap">
        <svg class="die-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" stroke="#e8c65a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M50 4 L50 46 M10 27 L50 46 M90 27 L50 46 M50 46 L10 73 M50 46 L90 73 M50 46 L50 96" stroke="#e8c65a" stroke-width="1.1" opacity="0.5"/>
          <text class="num num-20" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">20</text>
          <text class="num num-7" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">7</text>
          <text class="num num-3" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">3</text>
          <text class="num num-14" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">14</text>
        </svg>
      </div>
    </div>
    <div>
      <div class="loading-text">Consultando gli antichi registri…</div>
      <div class="loading-sub">un istante: il destino si sta scrivendo</div>
    </div>
  </div>

  <div id="contenuto" style="display:none;">
    <div class="dashboard-wrap">
      <div class="dashboard-header">
        <div>
          <a class="link-back" href="dashboard.html">&larr; Torna alla dashboard</a>
          <h1 style="font-family: var(--font-heading); color: var(--color-gold-bright); margin:0;">
            Gestione utenti
          </h1>
        </div>
        <div id="slot-utente" class="slot-utente"></div>
      </div>

      <div class="panel-wide">
        <div class="table-scroll">
          <table class="tabella-utenti">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Verificata</th>
                <th>Accesso</th>
                <th>Ruolo</th>
                <th>Registrato il</th>
                <th>Azioni</th>
              </tr>
            </thead>
            <tbody id="corpo-tabella">
              <!-- righe generate dinamicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <footer class="site-footer">Sotterranei &amp; Dragoni — portale di campagna per il gruppo</footer>

  <script type="module" src="assets/js/pagine/admin-utenti.js"></script>
</body>
</html>
