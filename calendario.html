<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- Content Security Policy: vedi il commento in testa a test/pagine/pagine.test.mjs -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.scdn.co https://*.spotifycdn.com https://img.youtube.com https://i.ytimg.com; connect-src 'self' https://*.googleapis.com https://www.google.com https://accounts.spotify.com https://api.spotify.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://recaptcha.google.com https://sotterranei-e-dragoni.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1f2f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icone/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="assets/icone/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icone/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="S&amp;D" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Sotterranei &amp; Dragoni — Calendario</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/calendario.css" />
  <script type="module" src="assets/js/pwa.js"></script>
</head>
<body class="pagina-ridisegnata pagina-interna" data-voce="calendario">
  <div id="veil" class="loading-veil">
    <div class="die-stage">
      <div class="die-shadow"></div>
      <div class="die-svg-wrap">
        <svg class="die-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" stroke="#e8c65a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M50 4 L50 46 M10 27 L50 46 M90 27 L50 46 M50 46 L10 73 M50 46 L90 73 M50 46 L50 96" stroke="#e8c65a" stroke-width="1.1" opacity="0.5"/>
          <text class="num num-20" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">20</text>
          <text class="num num-7" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">7</text>
          <text class="num num-3" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">3</text>
          <text class="num num-14" x="50" y="53" text-anchor="middle" font-family="Cinzel, serif" font-weight="700" font-size="21" fill="#e8c65a">14</text>
        </svg>
      </div>
    </div>
    <div>
      <div class="loading-text">Consultando gli antichi registri…</div>
      <div class="loading-sub">un istante: il destino si sta scrivendo</div>
    </div>
  </div>

  <div id="contenuto" style="display:none;">
    <div class="rd-guscio">
      <aside id="rd-barra" class="rd-barra" aria-label="Navigazione"></aside>
      <div id="rd-velo" class="rd-velo" hidden></div>
      <main class="rd-principale">
        <div class="rd-fascia" aria-hidden="true"></div>
        <div class="dashboard-wrap rd-pagina">
          <header class="rd-testata-pagina">
            <button type="button" id="rd-btn-menu" class="rd-btn-menu" aria-label="Apri il menu" aria-controls="rd-barra" aria-expanded="false"><span class="rd-menu-icona" aria-hidden="true"><i></i><i></i><i></i></span></button>
            <div class="rd-titoli">
              <p id="rd-riga-campagna" class="rd-riga-campagna" hidden></p>
              <h1 class="rd-titolo-pagina">Calendario</h1>
            </div>
            <div class="rd-comandi-pagina">
              <button type="button" id="btn-organizza" class="rd-btn rd-btn-primario rd-btn-piccolo" aria-haspopup="dialog" aria-controls="finestra-organizza" hidden>+ Organizza una sessione</button>
            </div>
            <div id="slot-utente" class="slot-utente rd-slot"></div>
          </header>

          <div id="nessuna-campagna" class="panel rd-perg" hidden>
            <p id="testo-nessuna-campagna" class="scheda-testo-libero"></p>
          </div>

          <div id="corpo-calendario" class="calendario-ridisegnato" hidden>
            <section id="hero-prossima" class="calendario-hero" aria-labelledby="hero-titolo">
              <div class="calendario-hero-testi">
                <span id="hero-etichetta" class="calendario-etichetta">Prossima sessione</span>
                <h2 id="hero-titolo"></h2>
                <p id="hero-quando" class="calendario-hero-quando"></p>
                <p id="hero-note" class="calendario-hero-note" hidden></p>
              </div>
              <div id="hero-azioni" class="calendario-hero-azioni"></div>
            </section>

            <div class="calendario-layout">
              <section class="panel rd-blu calendario-mese" aria-labelledby="titolo-mese">
                <div class="calendario-intestazione">
                  <button type="button" id="mese-precedente" class="calendario-freccia" aria-label="Mese precedente">‹</button>
                  <h3 id="titolo-mese"></h3>
                  <button type="button" id="mese-successivo" class="calendario-freccia" aria-label="Mese successivo">›</button>
                </div>
                <div class="griglia-calendario" id="griglia-calendario"></div>
                <div id="giorno-scelto" class="calendario-giorno-scelto" aria-live="polite"></div>
                <div class="legenda-calendario">
                  <span class="evento-cal evento-programmata">Programmata</span>
                  <span class="evento-cal evento-proposta">Data proposta</span>
                  <span class="evento-cal evento-giocata">Giocata</span>
                </div>
              </section>

              <div class="calendario-colonna">
                <section id="pannello-proposte" class="panel rd-perg calendario-proposte" aria-labelledby="titolo-proposte" hidden>
                  <h3 id="titolo-proposte">Scegli le date</h3>
                  <div id="lista-proposte"></div>
                </section>

                <section class="panel rd-perg calendario-prossime" aria-labelledby="titolo-prossime">
                  <h3 id="titolo-prossime">Poi in calendario</h3>
                  <ul id="lista-prossime" class="lista-calendario"></ul>
                  <p id="prossime-vuoto" class="calendario-vuoto" hidden>Nessun'altra sessione in programma.</p>
                </section>
              </div>
            </div>
          </div>
        </div>
  
      </main>
    </div>
  </div>

  <dialog id="finestra-organizza" class="calendario-finestra" aria-labelledby="titolo-organizza">
    <form id="form-proposta" class="form-calendario">
      <div class="calendario-finestra-testa">
        <h3 id="titolo-organizza">Organizza una sessione</h3>
        <button type="button" id="btn-chiudi-organizza" class="btn-chiudi-modal" aria-label="Chiudi">×</button>
      </div>
      <div class="field">
        <label for="proposta-titolo">Titolo (facoltativo)</label>
        <input type="text" id="proposta-titolo" maxlength="80" placeholder="Es. Nella palude di Kalkash" />
      </div>
      <div class="field">
        <label for="proposta-note">Note per i giocatori (facoltativo)</label>
        <input type="text" id="proposta-note" maxlength="500" placeholder="Es. si gioca da Marco" />
      </div>
      <p class="calendario-finestra-etichetta" id="etichetta-date">Date</p>
      <div id="opzioni-proposta" class="opzioni-proposta" role="group" aria-labelledby="etichetta-date"></div>
      <p id="errore-organizza" class="calendario-finestra-errore" role="alert" hidden></p>
      <button type="button" id="btn-aggiungi-opzione" class="rd-btn rd-btn-secondario rd-btn-piccolo calendario-aggiungi-data">+ Aggiungi data</button>
      <div class="calendario-finestra-azioni">
        <button type="button" id="btn-fissa-data" class="rd-btn rd-btn-secondario rd-btn-piccolo" title="Fissa subito la prima data, senza chiedere ai giocatori">Fissa la data</button>
        <button type="submit" class="rd-btn rd-btn-primario rd-btn-piccolo">Proponi ai giocatori</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script type="module" src="assets/js/pagine/calendario.js"></script>
</body>
</html>
