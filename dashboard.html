<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sotterranei e Dragoni — Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="veil" class="loading-veil">Consultando gli antichi registri…</div>

  <div id="contenuto" style="display:none;">
    <div class="dashboard-wrap">
      <div class="dashboard-header">
        <div>
          <div class="site-subtitle" style="text-align:left; margin-bottom:4px;">Sotterranei e Dragoni</div>
          <h1 style="font-family: var(--font-heading); color: var(--color-gold-bright); margin:0;">
            Bentornato, <span id="nome-utente"></span>
          </h1>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span id="badge-livello" class="role-badge" style="display:none;"></span>
          <div id="slot-utente" class="slot-utente"></div>
        </div>
      </div>

      <div id="griglia-pannelli">
        <!-- Sezioni e pannelli vengono generati in base al ruolo -->
      </div>
    </div>
  </div>

  <div id="overlay-livello" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h2>Sei salito di livello!</h2>
      <p id="testo-livello"></p>
      <button id="btn-chiudi-livello" class="btn">Ho capito</button>
    </div>
  </div>

  <footer class="site-footer">Sotterranei e Dragoni — portale di campagna per il gruppo</footer>

  <script type="module">
    import { proteggiPagina, ROLES } from "./assets/js/auth.js";
    import { montaMenuUtente } from "./assets/js/menu-utente.js";

    const veil = document.getElementById("veil");
    const contenuto = document.getElementById("contenuto");
    const griglia = document.getElementById("griglia-pannelli");

    // Permessi a cascata: ogni ruolo vede anche le sezioni dei ruoli "sotto" di sé
    // (admin vede tutto, un DM vede anche gli strumenti da giocatore, ecc.) — utile
    // perché nella pratica una stessa persona ricopre più ruoli nella campagna.
    const GERARCHIA_RUOLI = {
      [ROLES.ADMIN]: [ROLES.ADMIN, ROLES.DM, ROLES.PLAYER],
      [ROLES.DM]: [ROLES.DM, ROLES.PLAYER],
      [ROLES.PLAYER]: [ROLES.PLAYER],
    };

    const SEZIONI_PANNELLI = [
      {
        ruolo: ROLES.ADMIN,
        titolo: "Area Admin",
        pannelli: [
          { titolo: "Gestione utenti", testo: "Vedi tutti gli utenti registrati, assegna i ruoli e invia reset password.", link: "admin-utenti.html" },
          { titolo: "Impostazioni campagna", testo: "Qui potrai configurare la campagna. (In arrivo)" },
        ],
      },
      {
        ruolo: ROLES.DM,
        titolo: "Area Dungeon Master",
        pannelli: [
          { titolo: "Party e livelli", testo: "Vedi il tuo party e segnala una salita di livello.", link: "dm-party.html" },
          { titolo: "Glossario equipaggiamento", testo: "Cerca armi, armature, oggetti e pacchi del regolamento per verifiche rapide.", link: "glossario-equipaggiamento.html" },
          { titolo: "Glossario incantesimi", testo: "Cerca incantesimi per nome, classe o livello per verifiche rapide al tavolo.", link: "glossario-incantesimi.html" },
          { titolo: "Schede dei giocatori", testo: "Consulterai qui le schede dei personaggi, in sola lettura. (In arrivo)" },
          { titolo: "Controllo musica", testo: "Qui potrai gestire playlist Spotify/YouTube per la sessione. (In arrivo)" },
        ],
      },
      {
        ruolo: ROLES.PLAYER,
        titolo: "Area Giocatore",
        pannelli: [
          { titolo: "I miei personaggi", testo: "Crea uno o più personaggi e scegli quale rendere attivo per la campagna.", link: "i-miei-personaggi.html" },
          { titolo: "Musica di sessione", testo: "Qui vedrai cosa sta suonando il Dungeon Master. (In arrivo)" },
        ],
      },
    ];

    function renderPannelli(ruolo) {
      const ruoliVisibili = GERARCHIA_RUOLI[ruolo] || [ROLES.PLAYER];

      griglia.innerHTML = SEZIONI_PANNELLI.filter((sezione) => ruoliVisibili.includes(sezione.ruolo))
        .map((sezione) => {
          const cardsHtml = sezione.pannelli
            .map((p) => {
              const contenuto = `<h3>${p.titolo}</h3><p>${p.testo}</p>`;
              return p.link
                ? `<a class="panel" href="${p.link}" style="display:block; text-decoration:none;">${contenuto}</a>`
                : `<div class="panel">${contenuto}</div>`;
            })
            .join("");
          return `
            <div class="sezione-titolo">${sezione.titolo}</div>
            <div class="dashboard-grid">${cardsHtml}</div>
          `;
        })
        .join("");
    }

    proteggiPagina(async (user, profilo) => {
      const nome = profilo?.nome || user.displayName || user.email;
      const ruolo = profilo?.ruolo || ROLES.PLAYER;

      document.getElementById("nome-utente").textContent = nome;
      renderPannelli(ruolo);

      // Il livello personale è visibile a tutti: anche un DM o un admin possono
      // avere (o volere) un proprio personaggio nella campagna.
      const badgeLivello = document.getElementById("badge-livello");
      badgeLivello.textContent = `Livello ${profilo?.livello ?? 1}`;
      badgeLivello.style.display = "inline-block";

      const notifiche = await montaMenuUtente({ contenitore: document.getElementById("slot-utente"), user, profilo });

      const livelliNonLetti = notifiche.filter((n) => !n.letta && n.tipo === "livello_su");
      if (livelliNonLetti.length > 0) {
        const ultima = livelliNonLetti[0];
        let testo =
          `Il tuo Dungeon Master ti ha fatto salire dal livello ${ultima.livelloPrecedente} ` +
          `al livello ${ultima.livelloNuovo}. Potrai spendere i punti guadagnati non appena ` +
          `sarà pronta la scheda personaggio.`;
        if (livelliNonLetti.length > 1) {
          testo += ` Hai ${livelliNonLetti.length} notifiche di livello non lette: consultale dalla campanella.`;
        }
        document.getElementById("testo-livello").textContent = testo;
        document.getElementById("overlay-livello").style.display = "flex";

        document.getElementById("btn-chiudi-livello").addEventListener(
          "click",
          () => {
            document.getElementById("overlay-livello").style.display = "none";
          },
          { once: true }
        );
      }

      veil.style.display = "none";
      contenuto.style.display = "block";
    });
  </script>
</body>
</html>
