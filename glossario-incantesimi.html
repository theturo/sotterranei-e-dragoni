<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sotterranei e Dragoni — Glossario incantesimi</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="veil" class="loading-veil">Consultando gli antichi registri…</div>

  <div id="contenuto" style="display:none;">
    <div class="dashboard-wrap">
      <div class="dashboard-header">
        <div>
          <a class="link-back" href="dashboard.html">&larr; Torna alla dashboard</a>
          <h1 style="font-family: var(--font-heading); color: var(--color-gold-bright); margin:0;">
            Glossario incantesimi
          </h1>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="role-badge">SRD 5.1</span>
          <div id="slot-utente" class="slot-utente"></div>
        </div>
      </div>

      <div class="panel-wide">
        <div class="glossario-controlli">
          <input type="text" id="ricerca-glossario" class="input-ricerca" placeholder="Cerca un incantesimo…" autocomplete="off" />
          <select id="filtro-classe" class="select-filtro">
            <option value="">Tutte le classi</option>
            <option value="bardo">Bardo</option>
            <option value="chierico">Chierico</option>
            <option value="druido">Druido</option>
            <option value="guerriero">Guerriero</option>
            <option value="ladro">Ladro</option>
            <option value="mago">Mago</option>
            <option value="monaco">Monaco</option>
            <option value="paladino">Paladino</option>
            <option value="ranger">Ranger</option>
            <option value="stregone">Stregone</option>
            <option value="warlock">Warlock</option>
          </select>
          <select id="filtro-livello" class="select-filtro">
            <option value="">Tutti i livelli</option>
            <option value="0">Trucchetto</option>
            <option value="1">1° livello</option>
            <option value="2">2° livello</option>
            <option value="3">3° livello</option>
            <option value="4">4° livello</option>
            <option value="5">5° livello</option>
            <option value="6">6° livello</option>
            <option value="7">7° livello</option>
            <option value="8">8° livello</option>
            <option value="9">9° livello</option>
          </select>
        </div>
        <div id="risultati-glossario" class="glossario-risultati"></div>
        <p id="glossario-vuoto" class="scheda-testo-libero" hidden>Nessun incantesimo trovato: prova un altro termine.</p>
        <p id="glossario-suggerimento" class="scheda-testo-libero">
          Digita un termine di ricerca, oppure scegli una classe o un livello qui sopra per sfogliare.
        </p>
      </div>
    </div>
  </div>

  <footer class="site-footer">Sotterranei e Dragoni — portale di campagna per il gruppo</footer>

  <script type="module">
    import { proteggiPaginaDM } from "./assets/js/auth.js";
    import { montaMenuUtente } from "./assets/js/menu-utente.js";
    import { INCANTESIMI, cercaIncantesimi } from "./assets/js/incantesimi-srd.js";

    const veil = document.getElementById("veil");
    const contenuto = document.getElementById("contenuto");
    const inputRicerca = document.getElementById("ricerca-glossario");
    const selectClasse = document.getElementById("filtro-classe");
    const selectLivello = document.getElementById("filtro-livello");
    const risultati = document.getElementById("risultati-glossario");
    const vuoto = document.getElementById("glossario-vuoto");
    const suggerimento = document.getElementById("glossario-suggerimento");

    function tuttiGliIncantesimi() {
      return Object.entries(INCANTESIMI)
        .map(([chiave, dati]) => ({ chiave, ...dati }))
        .sort((a, b) => a.livello - b.livello || a.nome.localeCompare(b.nome));
    }

    function dettagliVoce(voce) {
      const etichettaLivello = voce.livello === 0 ? "Trucchetto" : `${voce.livello}° livello`;
      const bandierine = [voce.concentrazione ? "Concentrazione" : null, voce.rituale ? "Rituale" : null].filter(Boolean).join(" · ");
      const rigaEffetto = voce.danno
        ? `<p class="glossario-riga-effetto"><label>Danno</label> ${voce.danno}</p>`
        : voce.cura
        ? `<p class="glossario-riga-effetto"><label>Cura</label> ${voce.cura}</p>`
        : "";
      return `
        <p><label>Livello</label> ${etichettaLivello} · ${voce.scuola}${bandierine ? ` · ${bandierine}` : ""}</p>
        <p><label>Tempo di lancio</label> ${voce.tempoLancio} · <label>Gittata</label> ${voce.gittata}</p>
        <p><label>Componenti</label> ${voce.componenti} · <label>Durata</label> ${voce.durata}</p>
        <p><label>Classi</label> ${voce.classi.map((c) => c[0].toUpperCase() + c.slice(1)).join(", ")}</p>
        ${rigaEffetto}
        <p>${voce.descrizione}</p>
      `;
    }

    function renderRisultati(voci) {
      if (voci.length === 0) {
        risultati.innerHTML = "";
        vuoto.hidden = false;
        return;
      }
      vuoto.hidden = true;
      risultati.innerHTML = voci
        .map(
          (voce) => `
        <div class="glossario-card">
          <div class="glossario-card-header">
            <h3>${voce.nome}</h3>
            <span class="role-badge">${voce.livello === 0 ? "Trucchetto" : `${voce.livello}° liv.`}</span>
          </div>
          ${dettagliVoce(voce)}
        </div>`
        )
        .join("");
    }

    function aggiorna() {
      const testo = inputRicerca.value.trim();
      const classe = selectClasse.value;
      const livello = selectLivello.value === "" ? undefined : Number(selectLivello.value);

      if (!testo && !classe && livello === undefined) {
        risultati.innerHTML = "";
        vuoto.hidden = true;
        suggerimento.hidden = false;
        return;
      }
      suggerimento.hidden = true;

      const voci = testo
        ? cercaIncantesimi(testo, { classe: classe || undefined, livello })
        : tuttiGliIncantesimi()
            .filter((v) => !classe || v.classi.includes(classe))
            .filter((v) => livello === undefined || v.livello === livello);

      renderRisultati(voci);
    }

    inputRicerca.addEventListener("input", aggiorna);
    selectClasse.addEventListener("change", aggiorna);
    selectLivello.addEventListener("change", aggiorna);

    proteggiPaginaDM((user, profilo) => {
      montaMenuUtente({ contenitore: document.getElementById("slot-utente"), user, profilo });
      veil.style.display = "none";
      contenuto.style.display = "block";
    });
  </script>
</body>
</html>
