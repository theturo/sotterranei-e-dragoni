<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- Content Security Policy: vedi il commento in testa a test/pagine/pagine.test.mjs -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.scdn.co https://*.spotifycdn.com https://img.youtube.com https://i.ytimg.com; connect-src 'self' https://*.googleapis.com https://www.google.com https://accounts.spotify.com https://api.spotify.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://recaptcha.google.com https://sotterranei-e-dragoni.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#150d08" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icone/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icone/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icone/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="S&amp;D" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Sotterranei &amp; Dragoni — Crea il tuo account</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script type="module" src="assets/js/pwa.js"></script>
</head>
<body>
  <div class="top-banner">
    <h1 class="site-title">Sotterranei &amp; Dragoni</h1>
    <div class="site-subtitle">Il portale della campagna</div>
  </div>

  <div class="page-shell">
    <div class="scroll-card">
      <h2>Forgia il tuo account</h2>
      <p class="card-tagline">Ogni avventuriero ha bisogno di un'identità</p>

      <div id="messaggio" class="message"></div>

      <form id="form-registrazione" novalidate>
        <div class="field">
          <label for="nome">Nome (come vuoi essere chiamato)</label>
          <input type="text" id="nome" name="nome" autocomplete="name" maxlength="60" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />
        </div>
        <div class="field">
          <label for="conferma-password">Conferma password</label>
          <input type="password" id="conferma-password" name="conferma-password" autocomplete="new-password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-secondary" id="btn-registrazione">Crea account</button>
      </form>

      <div class="divider"></div>

      <p class="form-footer">
        Hai già un account? <a href="index.html">Accedi qui</a>
      </p>
    </div>
  </div>

  <footer class="site-footer">Sotterranei &amp; Dragoni — portale di campagna per il gruppo</footer>

  <script type="module" src="assets/js/pagine/register.js"></script>
</body>
</html>
