<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sotterranei e Dragoni — Crea il tuo account</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="top-banner">
    <h1 class="site-title">Sotterranei e Dragoni</h1>
    <div class="site-subtitle">Il portale della campagna</div>
  </div>

  <div class="page-shell">
    <div class="scroll-card">
      <h2>Forgia il tuo account</h2>
      <p class="card-tagline">Ogni avventuriero ha bisogno di un'identità</p>

      <div id="messaggio" class="message"></div>

      <form id="form-registrazione" novalidate>
        <div class="field">
          <label for="nome">Nome (come vuoi essere chiamato)</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required />
        </div>
        <div class="field">
          <label for="conferma-password">Conferma password</label>
          <input type="password" id="conferma-password" name="conferma-password" autocomplete="new-password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-secondary" id="btn-registrazione">Crea account</button>
      </form>

      <div class="divider"></div>

      <p class="form-footer">
        Hai già un account? <a href="index.html">Accedi qui</a>
      </p>
    </div>
  </div>

  <footer class="site-footer">Sotterranei e Dragoni — portale di campagna per il gruppo</footer>

  <script type="module">
    import { registraUtente, traduciErrore } from "./assets/js/auth.js";

    const form = document.getElementById("form-registrazione");
    const messaggio = document.getElementById("messaggio");
    const bottone = document.getElementById("btn-registrazione");

    function mostraMessaggio(testo, tipo) {
      messaggio.textContent = testo;
      messaggio.className = `message visible ${tipo}`;
    }

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      messaggio.className = "message";

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confermaPassword = document.getElementById("conferma-password").value;

      if (password !== confermaPassword) {
        mostraMessaggio("Le due password non coincidono.", "error");
        return;
      }

      bottone.disabled = true;
      bottone.textContent = "Creazione in corso…";

      try {
        await registraUtente({ nome, email, password });
        window.location.href = "verifica-email.html";
      } catch (errore) {
        mostraMessaggio(traduciErrore(errore.code), "error");
        bottone.disabled = false;
        bottone.textContent = "Crea account";
      }
    });
  </script>
</body>
</html>
